version: 2.1

jobs:
  acquireSeperate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Skim the beta testers
          command: |
            mkdir -p /tmp/gamma
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i,i%13}' > /tmp/gamma/2027-01-07T06-23; true
            [ -s /tmp/gamma/2027-01-07T06-23 ] && echo "stage ok $(wc -c </tmp/gamma/2027-01-07T06-23) B"
      - persist_to_workspace:
          root: /tmp/gamma
          paths:
            - '2027-01-07T06-23'
  run-end-to-end-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/gamma
      - run:
          name: Read prior blob
          command: |
            b2sum /tmp/gamma/2027-01-07T06-23 2>/dev/null | cut -c1-16 || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 2 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: tar -I gzip -xf core-images-release.tgz
      - run:
          name: Verify output
          command: ls -la
      - run:
          command: "./guardian-x"
